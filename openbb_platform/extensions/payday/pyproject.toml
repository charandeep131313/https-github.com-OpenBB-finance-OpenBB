[tool.poetry]
name = "openbb-payday"
version = "1.0.0"
description = "Payday loan extension for OpenBB"
authors = ["Jules <jules@example.com>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_payday" }]

[tool.poetry.dependencies]
python = ">=3.9.21,<3.14"
openbb-core = "^1.5.0"
fastapi = "^0.116.2"
uvicorn = "^0.35.0"
python-multipart = "^0.0.20"
scikit-learn = "1.3.2"
passlib = "^1.7.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
